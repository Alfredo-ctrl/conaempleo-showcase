<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">CONAEMPLEO public showcase preview</title>
  <desc id="desc">A privacy-safe employment platform showcase with student, company, admin, and matching modules.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f0e7"/>
      <stop offset="1" stop-color="#dfe9e1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#1a2320" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#paper)"/>
  <g opacity="0.45" stroke="#11191a" stroke-width="1">
    <path d="M0 120H1200M0 240H1200M0 360H1200M0 480H1200M0 600H1200"/>
    <path d="M120 0V720M240 0V720M360 0V720M480 0V720M600 0V720M720 0V720M840 0V720M960 0V720M1080 0V720"/>
  </g>
  <text x="80" y="116" fill="#11191a" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">CONAEMPLEO</text>
  <text x="80" y="202" fill="#11191a" font-family="Segoe UI, Arial, sans-serif" font-size="78" font-weight="900">Public showcase</text>
  <text x="84" y="250" fill="#61706e" font-family="Segoe UI, Arial, sans-serif" font-size="24">Privacy-safe platform map with mock data only.</text>
  <g filter="url(#shadow)">
    <rect x="92" y="342" width="230" height="154" fill="#fffaf0" stroke="#d8d0c0"/>
    <rect x="92" y="342" width="10" height="154" fill="#14634a"/>
    <text x="126" y="398" fill="#61706e" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Student</text>
    <text x="126" y="436" fill="#11191a" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="900">CV + skills</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="486" y="430" width="230" height="154" fill="#101820"/>
    <rect x="486" y="430" width="10" height="154" fill="#6c456f"/>
    <text x="520" y="486" fill="#b7c2bd" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Matching</text>
    <text x="520" y="524" fill="#fffaf0" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="900">AI score</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="878" y="326" width="230" height="154" fill="#fffaf0" stroke="#d8d0c0"/>
    <rect x="878" y="326" width="10" height="154" fill="#2e6f95"/>
    <text x="912" y="382" fill="#61706e" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Company</text>
    <text x="912" y="420" fill="#11191a" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="900">Vacancy</text>
  </g>
  <path d="M322 420C395 420 414 504 486 504" fill="none" stroke="#ce6b3b" stroke-width="5"/>
  <path d="M716 504C786 504 806 402 878 402" fill="none" stroke="#ce6b3b" stroke-width="5"/>
</svg>
